<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modernised clean login page</title>
    <!-- Basic Icons -->
    <!-- <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <!-- Filled Icons -->

      href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css"

    <!-- Brand Icons -->

    /> -->

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family:monospace;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: url('images/pexels-eberhardgross-12486830.jpg') no-repeat;
        background-size: cover;
        background-position: center;
      }

      .wrapper {
        align-items: center;
        width: 420px;
        color: #fff;
        background-color:transparent;
        backdrop-filter: blur(20px);
        box-shadow: 0 0 10px grey;
        border: 2px transparent;
        border-radius: 20px;
        padding: 20px;
      }

      .wrapper h2 {
        font-size: 32px;
        text-align: center;
        color: rgb(69, 77, 77);
      }

      .wrapper .input-box {
        /* width: 100%; */
        height: 50px;
        margin: 30px 0px;
        position: relative;
        /* background-color: salmon; */
      }

      .input-box input {
        height: 100%;
        width: 100%;
        background-color: transparent;
        border: 2px solid gray;
        border-radius: 30px;
        font-size: 16px;
        color: rgb(85, 57, 19);
        padding: 20px 45px 20px 20px;
      }

      .input-box input::placeholder {
        color: rgb(58, 60, 62);
      }

      .input-box i {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
      }

      .wrapper .remember-forgot {
        width: 100%;
        /* background-color: salmon; */
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 15px;
        margin: -15px 0px 15px;
        /* font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; */
      }

      .remember-forgot label input{
        color: #fff;
        margin :3px;
      }

      .remember-forgot a{
        color: #fff;
        text-decoration: none;
      }

      .remember-forgot a:hover{
        text-decoration: underline;
      }

      .wrapper .btn{
        width: 100%;
        height: 45px;
        background-color: #fff;
        border: none;
        outline: none;
        color: rgb(52, 49, 49);
        font-size: 20px;
        font-weight: 900;
        box-shadow: #474242;
        cursor: pointer;
        border-radius: 30px;
        transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
      }
      .wrapper .btn:hover{
        background-color: rgb(55, 55, 55);
        color:#e6e2e2
      }
      .wrapper .register-link{
        margin-top: 20px;
        color: #fff;
        font-weight: 500;
        text-align: center;
        font-size: 12px;
        margin: 20px 10px;
      }

      .register-link p a {
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        
      }
      .register-link p a:hover{
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <form action="">
        <h2>Login</h2>
        <div class="input-box">
          <input type="text" name="name" placeholder="Username" required>
          <i class="bx bx-user">
        </div>
        <div class="input-box">
          <input type="password" name="password" placeholder="Password">
          <i class="bx bx-lock" >
        </div>

        <div class="remember-forgot">
          <label><input type="checkbox" name="remeber"> Remeber me</label>
          <a href="#">Forgot Password</a>
        </div>
        <button type="submit" class="btn">Login</button>

        <div class="register-link">
          <p>Don't have an account <a href="#">Register</a></p>
        </div>
      </form>
    </div>
  </body>
</html>
