<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo-Centric</title>
    <style>
      body {
        padding: 0;
        margin: 0;
      }

      .logo {
        background-color: black;
        width: 50px;
        height: 50px;
        align-items: center;
        border-radius: 50px;
        /* margin: 40px; */
      }
      .nav-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        background-color:#2C687B;
        width: 100px;
        height: 100vh;
        margin: 5px;
        border-radius: 50px;
        border: 3px solid rgb(0, 75, 47);
        outline: none;
      }
      .nav-bar ul {
        margin: 0;
        padding: 0;
        display: flex;
        width: 100%;
        height: 70%;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: center;
        background-color: #EFE8DD;
        border-radius: 10px;
      }

      .nav-bar li {
        list-style-type: none;
        background-color:#EFE8DD;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .nav-bar .main-list a{
        text-decoration: none;
        font-family: monospace;
        font-weight: bold;
        font-size: 20px;
        color:#DB1A1A;
        /* border: 3px solid #2C687B; */
        padding-bottom: 20px;
        padding-top: 20px;
        border-top-left-radius: 50px;
        border-bottom-left-radius: 50px;
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
        transform: scale(1);
        transition: background-color 0.3s ease-in-out,color 0.3s ease-in-out , box-shadow 0.3s ease-in-out ,transform 0.3s ease-in-out;
      }
      .nav-bar .main-list a:hover{
        color:#ffffff;
        background-color: #DB1A1A;
        box-shadow:  0 6px 8px black;
        transform: scale(1.02);
        transition: background-color 0.3s ease-in-out,color 0.3s ease-in-out , box-shadow 0.3s ease-in-out ,transform 0.3s ease-in-out;
      }
      .signup-login{
        padding: 0;
        margin: 0;
        width: 100%;
        height:70px;
      }
      .signup-login button{
        font-family: monospace;
        font-size: 15px;
        font-weight: bold;
        color: #EFE8DD;
        padding: 0;
        margin: 0;
        background-color: #DB1A1A;
        height: 50px;
        border-radius: 30px;
        border: 3px solid #EFE8DD;
        width: 100%;
        transition: background-color 0.3s ease-in-out ,color 0.3s ease-in-out,border 0.3s ease-in-out, box-shadow 0.3s ease-in-out ;
      }

      .signup-login button:hover{
        color: #DB1A1A;
        background-color:#EFE8DD;
        border-color: 3px solid aliceblue;
        border: 3px solid  #DB1A1A;
        box-shadow: 0 8px 10px #38433e;
        transition: background-color 0.3s ease-in-out ,color 0.3s ease-in-out,border 0.3s ease-in-out, box-shadow 0.3s ease-in-out ;
      }

    </style>
  </head>
  <body>
    <div class="nav-bar">
      <img class="logo" src="images\nav-bar_2_logo.webp" alt="" />
      <ul class="main-list">
        <li><a href="">HOME</a></li>
        <li><a href="">LINK 1</a></li>
        <li><a href="">LINK 2</a></li>
        <li><a href="">LINK 3</a></li>
        <li><a href="">LINK 4</a></li>
        <li><a href="">LINK 5</a></li>
      </ul>
      <div class="signup-login">
        <button class="sign-up">Sign-Up</button>
        <!-- <button><a href="">Login</a></button> -->
      </div>
    </div>
  </body>
</html>
