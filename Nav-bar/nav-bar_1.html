<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar</title>
    <style>
        body{
            padding: 0;
            margin: 0;
        }

        .upper-box{
            text-align: center;
            font-family: monospace;
            background-color:rgb(40 233 159);
            width: 100%;
            height: 40px;
            border:3px  solid black;
            font-weight: bold;
            font-size: 15px;
        }

        .logo{
            width: 60px;
            height: 60px;
            align-items: center;
            background-color: aqua;
            margin-left: 20px;
        }
        .nav-bar{
            margin-top: 5px;
            background-color: beige ;
            height: 70px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            border: 3px solid black;
        }

        .nav-bar .main-list{
            padding: 0;
            margin: 0;
            /* display: block; */
            width:50%;
            padding: 10px;
            margin-left:100px ;
            display: flex;
            justify-content: space-around;
        }
        .nav-bar li{
            list-style-type: none;
            color: rgb(30, 31, 33);
        }

        .nav-bar .main-list a{
            text-decoration: none;
            color: rgb(32, 33, 35);
            font-family: monospace;
            font-weight: bold;
            font-size: 20px;
            padding: 5px;
            border: 3px solid beige;
            transition: transform 0.35s ease , box-shadow 0.25s ease;
        }
        .nav-bar .main-list a:hover{
            background-color:rgb(40 233 159) ;
            border-radius: 4px;
            color: Navy	rgb(24 26 42);
            border: 3px solid black;
            transition: background-color 0.3s ease-in-out , color 0.3s ease-in-out,border 0.3s ease-in-out ,transform 0.3s ease-in-out ,box-shadow 0.3s ease-in-out ;
            transform: scale(1.25);
            box-shadow: 0 8px 6px rgb(97, 95, 95);
        }

        .nav-bar .contact-signup{
            margin-right: 20px;
            width:20%
        }

        .contact-signup ul{
            display: flex;
            justify-content: space-evenly;
            padding: 5px;
        }

        .contact-signup .contact {
            color: rgb(21, 20, 20);
            font-size: 20px;
            font-family: monospace;
            font-weight: bold;
            text-decoration: none;
            padding: 8px;
            background-color:rgb(40 233 159) ;
            border: 3px solid black;
            border-radius: 5px;
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out , border 0.3s ease-in-out,box-shadow 0.3s ease-in-out;
        }
        
        .contact-signup .contact:hover{
            background-color: rgb(18, 20, 36);
            color: white;
            border:3px solid rgb(40 233 159);
            box-shadow: 0 8px 6px black;
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out , border 0.3s ease-in-out,box-shadow 0.3s ease-in-out;
            transform: scale(2);
        }
        .contact-signup .sign-up {
            color: rgb(21, 20, 20);
            font-size: 20px;
            font-family: monospace;
            font-weight: bold;
            text-decoration: none;
            padding: 8px;
            background-color:rgb(18, 20, 36) ;
            color: white ;
            border: 3px solid rgb(40 233 159);
            border-radius: 5px;
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out , border 0.3s ease-in-out,box-shadow 0.3s ease-in-out;
        }
        
        .contact-signup .sign-up:hover{
            background-color:rgb(40 233 159);
            color: rgb(3, 3, 3);
            border: 3px solid rgb(18, 17, 17);
            box-shadow: 0 8px 6px black;
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out , border 0.3s ease-in-out,box-shadow 0.3s ease-in-out;
            transform: scale(1.25);
        }
    </style>
</head>
<body>
    <div class="upper-box">
        <p>Navigation bar Cartoon design </p>
    </div>
    <div class="nav-bar">
        <img src="images/nav-bar_1_logo.jpg" alt="logo" class="logo">
        <ul class="main-list">
            <li><a href="#">HOME</a></li>
            <li><a href="#">PRICING</a></li>
            <li><a href="#">FEATURES</a></li>
            <li><a href="#">ENTERPRICE</a></li>
            <li><a href="#">BLOG</a></li>
            <li><a href="#">RESOURCES</a></li>
        </ul>
        <div class="contact-signup">
            <ul>
                <li><a href="" class="contact">Contact Sales</a></li>
                <li><a href="" class="sign-up">Sign-Up</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
